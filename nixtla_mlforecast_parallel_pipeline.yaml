          \ import MLForecast\n    from sklearn.ensemble import RandomForestRegressor,\
          \ ExtraTreesRegressor\n\n    logging.basicConfig(\n        level=logging.INFO,\n\
          \        format=\"%(asctime)s | %(levelname)s | %(name)s | %(message)s\"\
          ,\n    )\n    logger = logging.getLogger(\"train_single_model_component\"\
          )\n    logger.info(\"Starting training component for model_type=%s\", model_type)\n\
          \n    def wmape(y_true: np.ndarray, y_pred: np.ndarray) -> float:\n    \
          \    denom = np.abs(y_true).sum()\n        if denom == 0:\n            return\
          \ float(\"nan\")\n        return float(np.abs(y_true - y_pred).sum() / denom)\n\
          \n    client = bigquery.Client(project=project_id)\n    logger.info(\"Running\
          \ BigQuery training query for table=%s\", bq_table)\n    query = f\"\"\"\
          \n        SELECT *\n        FROM `{bq_table}`\n        WHERE unique_id IS\
          \ NOT NULL\n          AND ds IS NOT NULL\n          AND y IS NOT NULL\n\
          \        ORDER BY unique_id, ds\n    \"\"\"\n    df = client.query(query).to_dataframe()\n\
          \    logger.info(\"Fetched %d rows from BigQuery\", len(df))\n\n    if df.empty:\n\
          \        raise ValueError(\"No rows returned from BigQuery.\")\n\n    required_cols\
          \ = {\"unique_id\", \"ds\", \"y\"}\n    missing = required_cols - set(df.columns)\n\
