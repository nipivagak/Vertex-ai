pipelineInfo:
  description: Train multiple MLForecast models in parallel on Vertex AI Pipelines
    and select champion
  name: nixtla-mlforecast-parallel-pipeline
root:
  dag:
    tasks:
      select-champion-component:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-select-champion-component
        dependentTasks:
        - train-single-model-component
        - train-single-model-component-2
        - train-single-model-component-3
        inputs:
          parameters:
            champion_bq_table:
              componentInputParameter: champion_bq_table
            et_result:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: train-single-model-component-3
            lgbm_result:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: train-single-model-component
            metric_name:
              componentInputParameter: champion_metric
            project_id:
              componentInputParameter: project_id
            rf_result:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: train-single-model-component-2
        taskInfo:
          name: select-champion
      train-single-model-component:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-single-model-component
        inputs:
          parameters:
            bq_table:
              componentInputParameter: bq_table
            date_features:
              componentInputParameter: date_features
            forecast_freq:
              componentInputParameter: forecast_freq
            horizon:
              componentInputParameter: horizon
            lags:
              componentInputParameter: lags
            model_display_name:
              componentInputParameter: model_display_name
            model_type:
              runtimeValue:
                constant: lgbm
            prediction_bq_table:
              componentInputParameter: prediction_bq_table
            project_id:
              componentInputParameter: project_id
        taskInfo:
          name: train-lgbm
      train-single-model-component-2:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-single-model-component-2
        inputs:
          parameters:
            bq_table:
              componentInputParameter: bq_table
            date_features:
              componentInputParameter: date_features
            forecast_freq:
              componentInputParameter: forecast_freq
            horizon:
              componentInputParameter: horizon
            lags:
              componentInputParameter: lags
            model_display_name:
              componentInputParameter: model_display_name
            model_type:
              runtimeValue:
                constant: rf
            prediction_bq_table:
              componentInputParameter: prediction_bq_table
            project_id:
              componentInputParameter: project_id
        taskInfo:
          name: train-rf
      train-single-model-component-3:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-single-model-component-3
        inputs:
          parameters:
            bq_table:
              componentInputParameter: bq_table
            date_features:
              componentInputParameter: date_features
            forecast_freq:
              componentInputParameter: forecast_freq
            horizon:
              componentInputParameter: horizon
            lags:
              componentInputParameter: lags
            model_display_name:
              componentInputParameter: model_display_name
            model_type:
              runtimeValue:
                constant: et
            prediction_bq_table:
              componentInputParameter: prediction_bq_table
            project_id:
              componentInputParameter: project_id
        taskInfo:
          name: train-et
  inputDefinitions:
    parameters:
      bq_table:
        parameterType: STRING
      champion_bq_table:
        parameterType: STRING
      champion_metric:
        defaultValue: wmape
        isOptional: true
        parameterType: STRING
      date_features:
        defaultValue:
        - dayofweek
        - month
        isOptional: true
        parameterType: LIST
      forecast_freq:
        defaultValue: D
        isOptional: true
        parameterType: STRING
      horizon:
        defaultValue: 2.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      lags:
        defaultValue:
        - 1.0
        - 2.0
        - 3.0
        isOptional: true
        parameterType: LIST
      model_display_name:
        defaultValue: mlforecast
        isOptional: true
        parameterType: STRING
      prediction_bq_table:
        parameterType: STRING
      project_id:
        parameterType: STRING
