deploymentSpec:
  executors:
    exec-aggregate-training-results-component:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - aggregate_training_results_component
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef aggregate_training_results_component(\n    result1: str,\n  \
          \  result2: str,\n    result3: str,\n    result4: str,\n    result5: str,\n\
          ) -> str:\n    \"\"\"Aggregate training result JSON strings into a JSON\
          \ list.\"\"\"\n    import json\n    import logging\n\n    logging.basicConfig(\n\
          \        level=logging.INFO,\n        format=\"%(asctime)s | %(levelname)s\
          \ | %(name)s | %(message)s\",\n    )\n    logger = logging.getLogger(\"\
          aggregate_training_results_component\")\n\n    results = []\n    for index,\
          \ raw_result in enumerate([result1, result2, result3, result4, result5],\
          \ start=1):\n        result = json.loads(raw_result)\n        results.append(result)\n\
          \        logger.info(\n            \"Collected result %d for model_type=%s\"\
          ,\n            index,\n            result.get(\"model_type\", \"unknown\"\
          ),\n        )\n\n    logger.info(\"Aggregated %d training results\", len(results))\n\
          \    return json.dumps(results)\n\n"
        image: python:3.11
    exec-batch-forecast-component:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - batch_forecast_component
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas>=2.2.0'\
          \ 'google-cloud-storage>=2.18.0' 'google-cloud-bigquery>=3.25.0' 'pandas-gbq>=0.28.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef batch_forecast_component(\n    project_id: str,\n    bq_table:\
          \ str,\n    batch_forecast_bq_table: str,\n    forecast_freq: str,\n   \
          \ horizon: int,\n    lags: list[int],\n    date_features: list[str],\n \
          \   champion_result: str,\n) -> str:\n    \"\"\"Generate batch forecasts\
          \ using the champion model.\"\"\"\n    import json\n    import logging\n\
          \    import pandas as pd\n    from google.cloud import bigquery, storage\n\
          \n    logging.basicConfig(\n        level=logging.INFO,\n        format=\"\
          %(asctime)s | %(levelname)s | %(name)s | %(message)s\",\n    )\n    logger\
          \ = logging.getLogger(\"batch_forecast_component\")\n\n    champion = json.loads(champion_result)\n\
          \    champion_model_type = champion[\"champion_model_type\"]\n\n    logger.info(\"\
          Starting batch forecast with champion_model_type=%s\", champion_model_type)\n\
          \n    # Load recent data\n    bq_client = bigquery.Client(project=project_id)\n\
          \    query = f\"\"\"\n    SELECT unique_id, ds, y\n    FROM `{project_id}.{bq_table}`\n\
          \    ORDER BY ds DESC\n    LIMIT 1000\n    \"\"\"\n    df = bq_client.query(query).to_dataframe()\n\
          \    df[\"ds\"] = pd.to_datetime(df[\"ds\"])\n    logger.info(\"Loaded %d\
          \ rows for batch forecasting\", len(df))\n\n    # Generate forecasts\n \
          \   # For demo, create simple forecasts\n    forecast_data = []\n    run_ts\
          \ = pd.Timestamp.utcnow()\n    for uid in df[\"unique_id\"].unique():\n\
          \        last_y = df[df[\"unique_id\"] == uid][\"y\"].iloc[-1]\n       \
          \ for h in range(1, horizon + 1):\n            forecast_data.append({\n\
          \                \"unique_id\": uid,\n                \"ds\": pd.Timestamp.now()\
          \ + pd.Timedelta(days=h),\n                \"prediction\": last_y * (1.0\
          \ + 0.01 * h),\n                \"run_ts\": run_ts,\n                \"\
          model_type\": champion_model_type,\n                \"source_table\": bq_table,\n\
          \                \"forecast_freq\": forecast_freq,\n                \"horizon\"\
          : horizon,\n                \"is_future\": True,\n            })\n\n   \
          \ forecast_df = pd.DataFrame(forecast_data)\n    logger.info(\"Generated\
          \ %d forecast records\", len(forecast_df))\n\n    # Write to BigQuery\n\
          \    forecast_df.to_gbq(batch_forecast_bq_table, project_id=project_id,\
          \ if_exists=\"append\")\n    logger.info(\"Batch forecasts written to: %s\"\
          , batch_forecast_bq_table)\n\n    result = {\n        \"champion_model_type\"\
          : champion_model_type,\n        \"forecast_count\": len(forecast_df),\n\
          \        \"horizon\": horizon,\n    }\n\n    logger.info(\"Batch forecast\
          \ component completed\")\n    return json.dumps(result)\n\n"
        image: python:3.11
    exec-register-and-deploy-champion-component:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - register_and_deploy_champion_component
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas>=2.2.0'\
          \ 'google-cloud-aiplatform>=1.48.0'  &&  python3 -m pip install --quiet\
          \ --no-warn-script-location 'kfp==2.16.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef register_and_deploy_champion_component(\n    project_id: str,\n\
          \    region: str,\n    champion_result: str,\n    endpoint_display_name:\
          \ str,\n) -> str:\n    \"\"\"Register the champion model and deploy to Vertex\
          \ AI Endpoint.\"\"\"\n    import json\n    import logging\n\n    logging.basicConfig(\n\
          \        level=logging.INFO,\n        format=\"%(asctime)s | %(levelname)s\
          \ | %(name)s | %(message)s\",\n    )\n    logger = logging.getLogger(\"\
          register_and_deploy_champion_component\")\n\n    champion = json.loads(champion_result)\n\
          \    champion_model_type = champion[\"champion_model_type\"]\n\n    logger.info(\"\
          Registering and deploying champion model_type=%s to endpoint=%s\", champion_model_type,\
          \ endpoint_display_name)\n\n    # For this simplified version, just log\
          \ the action\n    # In production, you'd use aiplatform.Model.upload()\n\
          \n    result = {\n        \"champion_model_type\": champion_model_type,\n\
          \        \"champion_model_uri\": champion.get(\"champion_model_uri\"),\n\
          \        \"endpoint_display_name\": endpoint_display_name,\n        \"region\"\
          : region,\n        \"project_id\": project_id,\n        \"status\": \"deployment_skipped_in_demo\"\
          ,\n    }\n\n    logger.info(\"Register and deploy component completed\"\
          )\n    return json.dumps(result)\n\n"
        image: python:3.11
    exec-select-champion-component:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - select_champion_component
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas>=2.2.0'\
          \ 'google-cloud-bigquery>=3.25.0'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef select_champion_component(\n    project_id: str,\n    champion_bq_table:\
          \ str,\n    training_results_json: str,\n    metric_name: str = \"wmape\"\
          ,\n) -> str:\n    \"\"\"Select and persist the champion model from aggregated\
          \ results.\"\"\"\n    import json\n    import logging\n    import pandas\
          \ as pd\n    from google.cloud import bigquery\n\n    logging.basicConfig(\n\
          \        level=logging.INFO,\n        format=\"%(asctime)s | %(levelname)s\
          \ | %(name)s | %(message)s\",\n    )\n    logger = logging.getLogger(\"\
          select_champion_component\")\n\n    results = json.loads(training_results_json)\n\
          \    if not isinstance(results, list):\n        results = [results]\n\n\
          \    valid_results = [result for result in results if metric_name in result\
          \ and result[metric_name] is not None]\n    if not valid_results:\n    \
          \    raise ValueError(f\"No valid results found for metric '{metric_name}'.\"\
          )\n\n    champion = min(valid_results, key=lambda result: result[metric_name])\n\
          \    logger.info(\n        \"Champion selected: model_type=%s, %s=%.6f\"\
          ,\n        champion[\"model_type\"],\n        metric_name,\n        champion[metric_name],\n\
          \    )\n\n    champion_summary = {\n        \"run_ts\": pd.Timestamp.utcnow().isoformat(),\n\
          \        \"champion_model_type\": champion[\"model_type\"],\n        \"\
          champion_metric_name\": metric_name,\n        \"champion_metric_value\"\
          : champion[metric_name],\n        \"champion_model_uri\": champion.get(\"\
          model_uri\"),\n        \"model_display_name\": champion.get(\"model_display_name\"\
          ),\n        \"source_table\": champion.get(\"source_table\"),\n        \"\
          prediction_bq_table\": champion.get(\"prediction_bq_table\"),\n        \"\
          forecast_freq\": champion.get(\"forecast_freq\"),\n        \"horizon\":\
          \ champion.get(\"horizon\"),\n    }\n\n    table_id = f\"{project_id}.{champion_bq_table}\"\
          \n    bq_client = bigquery.Client(project=project_id)\n    errors = bq_client.insert_rows_json(table_id,\
          \ [champion_summary], skip_invalid_rows=True)\n    if errors:\n        raise\
          \ RuntimeError(f\"Failed to persist champion summary: {errors}\")\n\n  \
          \  logger.info(\"Champion summary persisted to BigQuery table: %s\", table_id)\n\
          \    return json.dumps(champion_summary)\n\n"
        image: python:3.11
    exec-train-single-model-component:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_single_model_component
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas>=2.2.0'\
          \ 'numpy>=1.26.0' 'scikit-learn>=1.4.0' 'lightgbm>=4.3.0' 'xgboost>=2.0.0'\
          \ 'mlforecast>=0.13.0' 'statsmodels>=0.14.0' 'arch>=6.0.0' 'statsforecast>=1.5.0'\
          \ 'google-cloud-bigquery>=3.25.0' 'google-cloud-storage>=2.18.0' 'pandas-gbq>=0.28.0'\
          \ 'pyarrow>=17.0.0' 'db-dtypes>=1.2.0'  &&  python3 -m pip install --quiet\
          \ --no-warn-script-location 'kfp==2.16.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_single_model_component(\n    project_id: str,\n    bq_table:\
          \ str,\n    prediction_bq_table: str,\n    forecast_freq: str,\n    horizon:\
          \ int,\n    lags: list[int],\n    date_features: list[str],\n    model_display_name:\
          \ str,\n    model_type: str,\n    model_artifact: Output[Model],\n    eval_metrics:\
          \ Output[Metrics],\n    eval_predictions: Output[Artifact],\n) -> str:\n\
          \    \"\"\"Train a single model type and return metadata JSON.\"\"\"\n \
          \   import json\n    import logging\n    from pathlib import Path\n\n  \
          \  logging.basicConfig(\n        level=logging.INFO,\n        format=\"\
          %(asctime)s | %(levelname)s | %(name)s | %(message)s\",\n    )\n    logger\
          \ = logging.getLogger(\"train_single_model_component\")\n    logger.info(\"\
          Starting training for model_type=%s\", model_type)\n\n    try:\n       \
          \ import pandas as pd\n        import numpy as np\n        from sklearn.ensemble\
          \ import RandomForestRegressor, ExtraTreesRegressor, GradientBoostingRegressor\n\
          \        from sklearn.linear_model import Ridge\n        from sklearn.svm\
          \ import SVR\n        from lightgbm import LGBMRegressor\n        from xgboost\
          \ import XGBRegressor\n        from mlforecast import MLForecast\n     \
          \   from statsmodels.tsa.arima.model import ARIMA\n        from statsmodels.tsa.exponential_smoothing.ets\
          \ import ExponentialSmoothing\n        from statsforecast.models import\
          \ AutoARIMA, AutoETS, AutoTheta, IMAPA, ADIDA, CrostonClassic, CrostonOptimized,\
          \ CrostonSBA, MSTL, AutoCES\n        from arch import arch_model\n     \
          \   from google.cloud import bigquery, storage\n\n        # Initialize BigQuery\
          \ client\n        bq_client = bigquery.Client(project=project_id)\n    \
          \    logger.info(\"BigQuery client initialized for project=%s\", project_id)\n\
          \n        # Load training data from BigQuery\n        query = f\"\"\"\n\
          \        SELECT unique_id, ds, y\n        FROM `{project_id}.{bq_table}`\n\
