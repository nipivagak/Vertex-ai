        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_single_model_component(\n    project_id: str,\n    bq_table:\
          \ str,\n    prediction_bq_table: str,\n    forecast_freq: str,\n    horizon:\
          \ int,\n    lags: list[int],\n    date_features: list[str],\n    model_display_name:\
          \ str,\n    model_type: str,\n    model_artifact: Output[Model],\n    eval_metrics:\
          \ Output[Metrics],\n    eval_predictions: Output[Artifact],\n) -> str:\n\
          \    \"\"\"Train a single model type and return metadata JSON.\"\"\"\n \
          \   import json\n    import logging\n    from pathlib import Path\n\n  \
          \  logging.basicConfig(\n        level=logging.INFO,\n        format=\"\
          %(asctime)s | %(levelname)s | %(name)s | %(message)s\",\n    )\n    logger\
          \ = logging.getLogger(\"train_single_model_component\")\n    logger.info(\"\
          Starting training for model_type=%s\", model_type)\n\n    try:\n       \
          \ import pandas as pd\n        import numpy as np\n        from sklearn.ensemble\
          \ import RandomForestRegressor, ExtraTreesRegressor, GradientBoostingRegressor\n\
          \        from sklearn.linear_model import Ridge\n        from sklearn.svm\
          \ import SVR\n        from lightgbm import LGBMRegressor\n        from xgboost\
          \ import XGBRegressor\n        from mlforecast import MLForecast\n     \
          \   from statsmodels.tsa.arima.model import ARIMA\n        from statsmodels.tsa.exponential_smoothing.ets\
          \ import ExponentialSmoothing\n        from statsforecast.models import\
          \ AutoARIMA, AutoETS, AutoTheta, IMAPA, ADIDA, CrostonClassic, CrostonOptimized,\
          \ CrostonSBA, MSTL, AutoCES\n        from arch import arch_model\n     \
          \   from google.cloud import bigquery, storage\n\n        # Initialize BigQuery\
          \ client\n        bq_client = bigquery.Client(project=project_id)\n    \
          \    logger.info(\"BigQuery client initialized for project=%s\", project_id)\n\
          \n        # Load training data from BigQuery\n        query = f\"\"\"\n\
          \        SELECT unique_id, ds, y\n        FROM `{project_id}.{bq_table}`\n\
          \        ORDER BY unique_id, ds\n        \"\"\"\n        logger.info(\"\
          Loading data from BigQuery table: %s\", bq_table)\n        df = bq_client.query(query).to_dataframe()\n\
          \        df[\"ds\"] = pd.to_datetime(df[\"ds\"])\n        logger.info(\"\
          Loaded %d rows from BigQuery\", len(df))\n\n        # Prepare model based\
          \ on type\n        if model_type == \"lgbm\":\n            model = LGBMRegressor(verbosity=-1,\
          \ random_state=0, n_jobs=1)\n        elif model_type == \"rf\":\n      \
          \      model = RandomForestRegressor(n_estimators=100, random_state=0, n_jobs=1)\n\
          \        elif model_type == \"et\":\n            model = ExtraTreesRegressor(n_estimators=100,\
          \ random_state=0, n_jobs=1)\n        elif model_type == \"xgb\":\n     \
          \       model = XGBRegressor(random_state=0, n_jobs=1)\n        elif model_type\
          \ == \"gb\":\n            model = GradientBoostingRegressor(random_state=0)\n\
          \        elif model_type == \"ridge\":\n            model = Ridge()\n  \
          \      elif model_type == \"svr\":\n            model = SVR()\n        elif\
          \ model_type == \"arima\":\n            model = AutoARIMA(season_length=12,\
          \ trace=True)\n        elif model_type == \"ets\":\n            model =\
          \ AutoETS(season_length=12, trace=True)\n        elif model_type == \"theta\"\
          :\n            model = AutoTheta()\n        elif model_type == \"imapa\"\
          :\n            model = IMAPA()\n        elif model_type == \"adida\":\n\
          \            model = ADIDA()\n        elif model_type == \"croston\":\n\
          \            model = CrostonClassic()\n        elif model_type == \"croston_optimized\"\
          :\n            model = CrostonOptimized()\n        elif model_type == \"\
          croston_sba\":\n            model = CrostonSBA()\n        elif model_type\
          \ == \"mstl\":\n            model = MSTL(season_length=24)\n        elif\
          \ model_type.startswith(\"garch_\"):\n            parts = model_type.split(\"\
          _\")\n            p, q = int(parts[1]), int(parts[2])\n            model\
          \ = arch_model(None, vol=\"Garch\", p=p, q=q)\n        elif model_type.startswith(\"\
          arch_\"):\n            p = int(model_type.split(\"_\")[1])\n           \
          \ model = arch_model(None, vol=\"ARCH\", p=p)\n        else:\n         \
          \   raise ValueError(f\"Unsupported model_type: {model_type}\")\n\n    \
          \    logger.info(\"Initialized model for model_type=%s\", model_type)\n\n\
          \        # Set up MLForecast\n        allowed_date_features = [\"year\"\
          , \"month\", \"week\", \"day\", \"dayofweek\", \"dayofyear\", \"quarter\"\
          ]\n        parsed_date_features = [x for x in date_features if x in allowed_date_features]\n\
          \n        fcst = MLForecast(\n            models={model_type: model},\n\
          \            freq=forecast_freq,\n            lags=lags,\n            date_features=parsed_date_features,\n\
          \            num_threads=1,\n        )\n\n        # Train/val split by series\n\
          \        unique_ids = df[\"unique_id\"].unique()\n        train_df = df[df[\"\
          unique_id\"].isin(unique_ids)]  # All for simplicity\n        valid_df =\
          \ df[df[\"unique_id\"].isin(unique_ids)].tail(horizon * len(unique_ids))\n\
          \n        logger.info(\"Training data: %d rows\", len(train_df))\n\n   \
          \     # Fit model\n        fcst.fit(train_df)\n        logger.info(\"Model\
          \ fitted successfully\")\n\n        # Generate predictions\n        Y_hat_df\
          \ = fcst.predict(h=horizon)\n        logger.info(\"Predictions generated\
          \ for horizon=%d\", horizon)\n\n        # Calculate metrics (WMAPE, MAE,\
          \ RMSE)\n        def wmape(y_true, y_pred):\n            denominator = y_true.abs().sum()\n\
          \            return (((y_true - y_pred).abs().sum() / denominator) * 100)\
          \ if denominator > 0 else 0\n\n        if len(valid_df) > 0:\n         \
          \   y_true = valid_df.set_index([\"unique_id\", \"ds\"])[\"y\"]\n      \
          \      y_pred = Y_hat_df.set_index([\"unique_id\", \"ds\"])[model_type]\n\
          \            metric_wmape = wmape(y_true, y_pred)\n            metric_mae\
          \ = (y_true - y_pred).abs().mean()\n            metric_rmse = (((y_true\
          \ - y_pred) ** 2).mean() ** 0.5)\n        else:\n            metric_wmape\
          \ = metric_mae = metric_rmse = 0.0\n\n        logger.info(\"Metrics - WMAPE:\
          \ %.4f, MAE: %.4f, RMSE: %.4f\", metric_wmape, metric_mae, metric_rmse)\n\
          \n        # Save model artifact\n        model_dir = Path(\"/tmp/model_artifacts\"\
          )\n        model_dir.mkdir(parents=True, exist_ok=True)\n        model_path\
          \ = model_dir / f\"{model_type}_model.pkl\"\n        import pickle\n   \
          \     with open(model_path, \"wb\") as f:\n            pickle.dump(fcst,\
          \ f)\n        logger.info(\"Model saved to %s\", model_path)\n\n       \
          \ # Upload to GCS\n        storage_client = storage.Client(project=project_id)\n\
          \        bucket_name = f\"{project_id}-mlforecast-models\"\n        blob_path\
          \ = f\"models/{model_display_name}/{model_type}/model.pkl\"\n        try:\n\
          \            bucket = storage_client.bucket(bucket_name)\n            blob\
          \ = bucket.blob(blob_path)\n            blob.upload_from_filename(model_path)\n\
          \            model_uri = f\"gs://{bucket_name}/{blob_path}\"\n         \
          \   logger.info(\"Model uploaded to %s\", model_uri)\n        except Exception\
          \ as e:\n            logger.warning(\"Could not upload to GCS: %s, using\
          \ local path\", str(e))\n            model_uri = str(model_path)\n\n   \
          \     # Write predictions to BigQuery using the expected evaluation schema.\n\
          \        predictions_table = prediction_bq_table\n        run_ts = pd.Timestamp.utcnow()\n\
          \        prediction_df = Y_hat_df.rename(columns={model_type: \"prediction\"\
          }).copy()\n        validation_cols = valid_df[[\"unique_id\", \"ds\", \"\
          y\"]].copy() if len(valid_df) > 0 else df[[\"unique_id\", \"ds\", \"y\"\
          ]].tail(len(prediction_df)).copy()\n        prediction_df = prediction_df.merge(validation_cols,\
          \ on=[\"unique_id\", \"ds\"], how=\"left\")\n        prediction_df[\"run_ts\"\
          ] = run_ts\n        prediction_df[\"model_display_name\"] = model_display_name\n\
          \        prediction_df[\"model_type\"] = model_type\n        prediction_df[\"\
          source_table\"] = bq_table\n        prediction_df[\"forecast_freq\"] = forecast_freq\n\
          \        prediction_df[\"horizon\"] = horizon\n        prediction_df = prediction_df[[\n\
          \            \"unique_id\",\n            \"ds\",\n            \"y\",\n \
          \           \"prediction\",\n            \"run_ts\",\n            \"model_display_name\"\
          ,\n            \"model_type\",\n            \"source_table\",\n        \
          \    \"forecast_freq\",\n            \"horizon\",\n        ]]\n        prediction_df.to_gbq(predictions_table,\
          \ project_id=project_id, if_exists=\"append\")\n        logger.info(\"Predictions\
          \ written to BigQuery table: %s\", predictions_table)\n\n        # Build\
          \ result metadata\n        metadata = {\n            \"model_type\": model_type,\n\
          \            \"forecast_freq\": forecast_freq,\n            \"horizon\"\
          : horizon,\n            \"lags\": lags,\n            \"date_features\":\
          \ parsed_date_features,\n            \"train_rows\": int(len(train_df)),\n\
          \            \"valid_rows\": int(len(valid_df)),\n            \"series_count\"\
          : int(df[\"unique_id\"].nunique()),\n            \"rmse\": float(metric_rmse),\n\
          \            \"mae\": float(metric_mae),\n            \"wmape\": float(metric_wmape),\n\
          \            \"model_uri\": model_uri,\n            \"model_display_name\"\
          : model_display_name,\n            \"source_table\": bq_table,\n       \
          \     \"prediction_bq_table\": prediction_bq_table,\n        }\n\n     \
          \   # Write metadata.json\n        with open(model_dir / \"metadata.json\"\
          , \"w\", encoding=\"utf-8\") as f:\n            json.dump(metadata, f, indent=2)\n\
          \n        logger.info(\"Training component completed successfully for model_type=%s\"\
          , model_type)\n        return json.dumps(metadata)\n\n    except Exception\
          \ as e:\n        logger.error(\"Error in training component: %s\", str(e),\
          \ exc_info=True)\n        # Return minimal result on error\n        return\
          \ json.dumps({\"model_type\": model_type, \"error\": str(e), \"wmape\":\
          \ 999999.0})\n\n"
        image: python:3.11
